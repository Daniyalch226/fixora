<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up | Fixora - Your Trusted Service Partner</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 60px;
            background: var(--bg-alt);
            position: relative;
            overflow: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 10;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-light);
        }

        .auth-tabs {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: var(--radius);
            margin-bottom: 32px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
            color: var(--text-light);
        }

        .auth-tab.active {
            background: var(--white);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .social-auth {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius);
            background: var(--white);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: #f8fafc;
            border-color: var(--primary);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
        }

        #signup-form {
            display: none;
        }

        .password-toggle {
            position: relative;
        }

        .toggle-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-light);
        }
    </style>
</head>
<body class="auth-page">
    <!-- Header (Simple) -->
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">
                <i data-lucide="zap" style="color: var(--primary);"></i>
                Fix<span>ora.</span>
            </a>
            <a href="index.html" class="nav-link"><i data-lucide="arrow-left" style="width: 18px; margin-right: 4px;"></i> Back to Home</a>
        </div>
    </header>

    <main class="auth-section">
        <!-- Background Blobs -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        
        <div class="auth-container">
            <div class="auth-card reveal">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Enter your details to access your account</p>
                </div>

                <div class="auth-tabs">
                    <div class="auth-tab active" onclick="switchAuth('login')">Login</div>
                    <div class="auth-tab" onclick="switchAuth('signup')">Sign Up</div>
                </div>

                <div class="social-auth">
                    <button class="social-btn">
                        <i data-lucide="chrome" style="width: 18px; color: #ea4335;"></i> Google
                    </button>
                    <button class="social-btn">
                        <i data-lucide="facebook" style="width: 18px; color: #1877f2;"></i> Facebook
                    </button>
                </div>

                <div class="divider">or continue with email</div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleAuth(event, 'login')">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label class="form-label" style="margin-bottom: 0;">Password</label>
                            <a href="#" style="font-size: 0.75rem; color: var(--primary);">Forgot password?</a>
                        </div>
                        <div class="password-toggle">
                            <input type="password" class="form-control" placeholder="••••••••" required>
                            <i data-lucide="eye" class="toggle-icon"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
                </form>

                <!-- Signup Form -->
                <form id="signup-form" onsubmit="handleAuth(event, 'signup')">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="password-toggle">
                            <input type="password" class="form-control" placeholder="Create a password" required>
                            <i data-lucide="eye" class="toggle-icon"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="display: flex; gap: 8px; font-size: 0.875rem; cursor: pointer;">
                            <input type="checkbox" required style="margin-top: 4px;">
                            <span>I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a> and <a href="#" style="color: var(--primary);">Privacy Policy</a></span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Create Account</button>
                </form>

                <div class="auth-footer" id="auth-footer-text">
                    Don't have an account? <a href="javascript:void(0)" onclick="switchAuth('signup')">Sign up</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        function switchAuth(type) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabs = document.querySelectorAll('.auth-tab');
            const headerTitle = document.querySelector('.auth-header h1');
            const headerText = document.querySelector('.auth-header p');
            const footerText = document.getElementById('auth-footer-text');

            if (type === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
                headerTitle.innerText = 'Welcome Back';
                headerText.innerText = 'Enter your details to access your account';
                footerText.innerHTML = 'Don\'t have an account? <a href="javascript:void(0)" onclick="switchAuth(\'signup\')">Sign up</a>';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
                headerTitle.innerText = 'Create Account';
                headerText.innerText = 'Join thousands of users getting things done';
                footerText.innerHTML = 'Already have an account? <a href="javascript:void(0)" onclick="switchAuth(\'login\')">Log in</a>';
            }
        }

        function handleAuth(event, type) {
            event.preventDefault();
            const btn = event.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<span class="loader"></span> Processing...';
            btn.disabled = true;

            // Mock authentication delay
            setTimeout(() => {
                alert(type === 'login' ? 'Logged in successfully!' : 'Account created successfully!');
                window.location.href = 'index.html';
            }, 1500);
        }

        // Simple reveal animation
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelector('.auth-card').classList.add('active');
                document.body.classList.add('loaded');
            }, 100);
        });
    </script>
</body>
</html>
