<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant – MEAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>MEAI</span>
            </div>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-chart-pie"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="chat.html" class="nav-link active">
                        <i class="fas fa-comment-dots"></i>
                        <span>AI Assistant</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="history.html" class="nav-link">
                        <i class="fas fa-history"></i>
                        <span>History</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="btn-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </aside>

        <!-- Main Panel -->
        <main class="main-panel">
            <header class="top-bar">
                <div class="welcome">
                    <h2>AI <span class="text-gradient">Assistant</span></h2>
                    <p>Ask me anything about your finances</p>
                </div>
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </header>

            <div class="card chat-container">
                <div id="chat-messages" class="messages-area">
                    <div class="message ai-message">
                        Hello! I'm your AI financial assistant. You can ask me things like "How much did I spend this week?" or "Where is my money going?"
                    </div>
                </div>
                
                <div class="input-container" style="padding: 1rem;">
                    <input type="text" id="chat-input" class="input-box" placeholder="Ask a question..." style="padding-right: 6rem;">
                    <button id="send-chat" class="btn-primary" style="position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%); padding: 0.6rem 1.2rem; border-radius: 12px; cursor: pointer; font-weight: 600;">
                        Send
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/chat.js"></script>
</body>
</html>
